<!DOCTYPE html
<html>
<head>
    <title>My Favorite Hobby</title>

    <style>
        * {
            font-family: Arial, sans-serif;
        }

        body {
            background-color: lightblue;
            text-align: center;
        }

        h1 {
            color: Pink;
            background-color: lightyellow;
            padding: 20px;
        }

        h2 {
            color: purple;
        }

        p {
            color: darkgreen;
            font-size: 17px;
        }

        #hobby {
            background-color: lightyellow;
            border: 5px solid pink;
            padding: 20px;
            margin: 30px;
        }

        #hobby p {
            background-color: lightpink;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>My Favorite Hobby</h1>

    <div id="hobby">

        <h2>Listening to Music </h2>

        <p>My favorite hobby is listening to music.</p>

        <p>I like listening to music because it helps me relax.</p>

        <p>I enjoy listening to my favorite songs during my free time.</p>

    </div>

</body>
</html>
